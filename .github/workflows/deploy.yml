name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}

jobs:
  deploy-send-mail:
    name: Deploy sendMail Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Create deployment ZIP
        run: |
          zip -r sendMail.zip \
            functions \
            index.js \
            package.json \
            node_modules

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name sendMail \
            --zip-file fileb://sendMail.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for code update to complete
        run: |
          aws lambda wait function-updated \
            --function-name sendMail \
            --region ${{ env.AWS_REGION }}

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name sendMail \
            --environment "Variables={GMAIL_USER=${{ secrets.GMAIL_USER }},GMAIL_PASS=${{ secrets.GMAIL_PASS }}}" \
            --region ${{ env.AWS_REGION }}

      - name: Wait for configuration update to complete
        run: |
          aws lambda wait function-updated \
            --function-name sendMail \
            --region ${{ env.AWS_REGION }}

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --function-name sendMail \
            --region ${{ env.AWS_REGION }} \
            --query '[FunctionName, Runtime, Handler, LastModified]' \
            --output table
