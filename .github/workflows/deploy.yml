name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}

jobs:
  deploy-send-mail:
    name: Deploy sendMail Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Create deployment ZIP
        run: |
          zip -r sendMail.zip \
            functions \
            index.js \
            package.json \
            node_modules

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create or update Lambda function
        run: |
          FUNCTION_NAME="sendMail"
          REGION="${{ env.AWS_REGION }}"
          ROLE_NAME="lambda-sendMail-role"

          # Check if function already exists
          if aws lambda get-function --function-name $FUNCTION_NAME --region $REGION 2>/dev/null; then
            echo "Function exists — updating code..."
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --zip-file fileb://sendMail.zip \
              --region $REGION

            aws lambda wait function-updated \
              --function-name $FUNCTION_NAME \
              --region $REGION
          else
            echo "Function does not exist — creating IAM role and Lambda function..."

            # Create IAM execution role if it doesn't exist
            ROLE_ARN=$(aws iam get-role --role-name $ROLE_NAME --query 'Role.Arn' --output text 2>/dev/null || true)
            if [ -z "$ROLE_ARN" ]; then
              ROLE_ARN=$(aws iam create-role \
                --role-name $ROLE_NAME \
                --assume-role-policy-document '{
                  "Version":"2012-10-17",
                  "Statement":[{
                    "Effect":"Allow",
                    "Principal":{"Service":"lambda.amazonaws.com"},
                    "Action":"sts:AssumeRole"
                  }]
                }' \
                --query 'Role.Arn' --output text)

              aws iam attach-role-policy \
                --role-name $ROLE_NAME \
                --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

              echo "Waiting 10s for IAM role to propagate..."
              sleep 10
            fi

            echo "Creating Lambda function with role: $ROLE_ARN"
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --runtime nodejs20.x \
              --handler index.handler \
              --timeout 30 \
              --memory-size 256 \
              --role $ROLE_ARN \
              --zip-file fileb://sendMail.zip \
              --region $REGION \
              --environment "Variables={GMAIL_USER=${{ secrets.GMAIL_USER }},GMAIL_PASS=${{ secrets.GMAIL_PASS }}}"

            aws lambda wait function-active \
              --function-name $FUNCTION_NAME \
              --region $REGION
          fi

      - name: Update Lambda configuration (Handler, Timeout, Memory, Env)
        run: |
          aws lambda update-function-configuration \
            --function-name sendMail \
            --handler index.handler \
            --timeout 30 \
            --memory-size 256 \
            --environment "Variables={GMAIL_USER=${{ secrets.GMAIL_USER }},GMAIL_PASS=${{ secrets.GMAIL_PASS }}}" \
            --region ${{ env.AWS_REGION }}

          aws lambda wait function-updated \
            --function-name sendMail \
            --region ${{ env.AWS_REGION }}

      - name: Create or reuse API Gateway HTTP API
        run: |
          FUNCTION_NAME="sendMail"
          REGION="${{ env.AWS_REGION }}"
          API_NAME="expense-tracker-api"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          LAMBDA_ARN="arn:aws:lambda:${REGION}:${ACCOUNT_ID}:function:${FUNCTION_NAME}"

          # ── 1. Find or create the HTTP API ─────────────────────────────────
          API_ID=$(aws apigatewayv2 get-apis --region $REGION \
            --query "Items[?Name=='${API_NAME}'].ApiId" --output text)

          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "Creating new HTTP API: ${API_NAME}"
            API_ID=$(aws apigatewayv2 create-api \
              --name $API_NAME \
              --protocol-type HTTP \
              --region $REGION \
              --query ApiId --output text)
            echo "Created API: $API_ID"
          else
            echo "Reusing existing API: $API_ID"
          fi

          # ── 2. Find or create the Lambda integration ────────────────────────
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations \
            --api-id $API_ID --region $REGION \
            --query "Items[?IntegrationUri=='${LAMBDA_ARN}'].IntegrationId" \
            --output text)

          if [ -z "$INTEGRATION_ID" ] || [ "$INTEGRATION_ID" = "None" ]; then
            echo "Creating Lambda integration..."
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id $API_ID \
              --integration-type AWS_PROXY \
              --integration-uri $LAMBDA_ARN \
              --payload-format-version 2.0 \
              --region $REGION \
              --query IntegrationId --output text)
            echo "Created integration: $INTEGRATION_ID"
          else
            echo "Reusing existing integration: $INTEGRATION_ID"
          fi

          # ── 3. Find or create POST /sendMail route ──────────────────────────
          ROUTE_KEY="POST /sendMail"
          ROUTE_ID=$(aws apigatewayv2 get-routes \
            --api-id $API_ID --region $REGION \
            --query "Items[?RouteKey=='${ROUTE_KEY}'].RouteId" \
            --output text)

          if [ -z "$ROUTE_ID" ] || [ "$ROUTE_ID" = "None" ]; then
            echo "Creating route: ${ROUTE_KEY}"
            aws apigatewayv2 create-route \
              --api-id $API_ID \
              --route-key "$ROUTE_KEY" \
              --target "integrations/${INTEGRATION_ID}" \
              --region $REGION
          else
            echo "Route already exists: $ROUTE_ID"
          fi

          # ── 4. Find or create $default auto-deploy stage ────────────────────
          STAGE_EXISTS=$(aws apigatewayv2 get-stages \
            --api-id $API_ID --region $REGION \
            --query "Items[?StageName=='\$default'].StageName" \
            --output text)

          if [ -z "$STAGE_EXISTS" ] || [ "$STAGE_EXISTS" = "None" ]; then
            echo "Creating \$default stage with auto-deploy..."
            aws apigatewayv2 create-stage \
              --api-id $API_ID \
              --stage-name '$default' \
              --auto-deploy \
              --region $REGION
          else
            echo "\$default stage already exists"
          fi

          # ── 5. Grant API Gateway permission to invoke Lambda ────────────────
          STATEMENT_ID="apigw-invoke-${API_ID}"
          aws lambda remove-permission \
            --function-name $FUNCTION_NAME \
            --statement-id $STATEMENT_ID \
            --region $REGION 2>/dev/null || true

          aws lambda add-permission \
            --function-name $FUNCTION_NAME \
            --statement-id $STATEMENT_ID \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${REGION}:${ACCOUNT_ID}:${API_ID}/*/*/sendMail" \
            --region $REGION

          # ── 6. Print final endpoint URL ─────────────────────────────────────
          API_URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/sendMail"
          echo ""
          echo "=============================================="
          echo "  API ENDPOINT (POST):"
          echo "  $API_URL"
          echo "=============================================="
          echo "API_URL=${API_URL}" >> $GITHUB_ENV

      - name: Verify deployment
        run: |
          echo "Lambda function:"
          aws lambda get-function-configuration \
            --function-name sendMail \
            --region ${{ env.AWS_REGION }} \
            --query '[FunctionName, Runtime, Handler, LastModified]' \
            --output table

          echo ""
          echo "Your API endpoint is ready:"
          echo "${{ env.API_URL }}"
